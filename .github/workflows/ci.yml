name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Frontend script checks
        run: node tests/test_ui_state.js
      - name: Agent scenarios (demo mode)
        run: python evaluation/eval_agent.py
      - name: Docker startup smoke test
        run: |
          docker compose up --build -d
          curl -fsS --retry 10 --retry-all-errors http://127.0.0.1:8002/api/health
          docker compose exec -T projects python seed_demo.py
